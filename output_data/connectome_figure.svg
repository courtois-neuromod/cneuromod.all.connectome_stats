  <!-- Hand-authored montage: this SVG is the single source of truth for panel
       layout (see CLAUDE.md, "Figures: the Inkscape montage pattern"). Each
       <image> below links a notebook panel by relative path and the box it is
       placed in is that panel's true on-page size — resize a box here in
       Inkscape and the next `invoke run` regenerates that panel at the new
       size, with text never stretched. After resizing anything here, run
       `invoke clean-figures && invoke run` so the panel actually redraws.

       Panels are drawn bare; legends are separate horizontal strips placed
       like any other element, and every title below is typeset once, here.

       Left column (J): nine sagittal glass brains, one per network, in the
       shared NETWORK_COLORS. It is the montage's network key and spans the
       full page height, so panel A's legend strip carries only the
       between-subject band and no panel repeats the nine colours.
       Row 1: the longitudinal claim (A), its per-subject companion (B) and
       the per-network quality claim (C) — CLAUDE.md, "Scientific objective".
       Rows 2-3: claim 2 (D) with the cross-context robustness checks inside
       one stimulus domain (E-I), sharing one legend strip placed once above
       them. H and I are ungated: the 1800 s gate leaves each with a single
       dataset. Placed here at the user's explicit request, which is why the
       strap above says in words that E-I are not a further headline claim. -->
