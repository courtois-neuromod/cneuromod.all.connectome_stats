# invoke.yaml

# Notebooks folders
notebooks_dir: notebooks

# source data folders
source_data_dir: source_data

# output data folders
output_data_dir: output_data

# figures base dir — each notebook writes into figures_dir/<notebook_stem>/,
# which airoh also uses as the "already ran" sentinel for that notebook.
figures_dir: output_data/figures

# Composed connectome figure.
#
# `svg` is a pipeline *source*, hand-authored in Inkscape, even though it lives
# under output_data/ — it has to, because it links the notebook panels by
# relative path and those links resolve from its own directory. It is also the
# single source of truth for panel geometry: `run-figure-layout` reads each
# placed box out of it into figures/panel_sizes.json, and the notebooks render
# each panel at exactly that size. `compose-figure` then renders it with the
# Inkscape CLI, an optional external dependency (see README.md).
figures:
  connectome_figure:
    svg: output_data/connectome_figure.svg
    output: output_data/connectome_figure.png
    dpi: 300

# Datalad datasets
#
# The cneuromod.all superdataset is the primary data source. It is a Datalad
# superdataset holding many subdatasets whose file content is retrieved on
# demand, not all at once.
#
#   - `url`        : remote to clone when no local checkout is available
#   - `output_dir` : where the superdataset is made available inside source_data/
#   - `source`     : path to an existing local checkout to use instead of cloning.
#                    This is the primary use case here — cneuromod.all already
#                    lives at ~/git/cneuromod.all, i.e. ../git/cneuromod.all
#                    relative to this repo — and can be overridden on the
#                    command line with `invoke fetch --source /path`.
#
# `qa_figures` is a second, much smaller source asset: per-run QC measures
# (head motion, tSNR) that `run-connectomes`/`run-group-stats` will use. Unlike
# cneuromod.all it is a Datalad dataset with NO annexed content — every tracked
# file is a plain git blob (~33 MB total) — so installing the tree *is*
# retrieving the data, and no content-fetch step follows it.
datasets:
  cneuromod_all:
    url: https://github.com/courtois-neuromod/cneuromod.all
    output_dir: source_data/cneuromod.all
    source: ../git/cneuromod.all
  qa_figures:
    url: https://github.com/courtois-neuromod/cneuromod.all.qa_figures
    output_dir: source_data/cneuromod.all.qa_figures
    source: ../git/cneuromod.all.qa_figures

# Which derivative subdataset of each cneuromod.all dataset holds the parcelled
# BOLD timeseries this project reads.
#
# As of 2026-08-17, 12 `{dataset}/timeseries` submodules are registered in
# cneuromod.all: floc, movie10, friends, things, hcptrt, harrypotter, mario,
# mario3, mariostars, petit-prince, retinotopy and shinobi. `fetch-timeseries`
# discovers them rather than reading this list — it fetches every dataset
# carrying the marker directory below.
timeseries_marker: timeseries

# Which parcellation's timeseries `run-connectomes` reads. Each *.timeseries
# repo ships schaefer1000, cneuromod2026, voxel_mni and voxel_native, each with
# its own `_dseg.nii.gz` parcellation and grey-matter mask alongside the `.h5`.
#
# cneuromod2026 (1134 parcels: cortex + subcortex + cerebellum) is primary as
# of 2026-08-17 — it lines up with what the qa_figures QC tables cover. This
# reverses the project's original schaefer1000-only choice; see CLAUDE.md,
# "Settled analysis decisions", for why. The code stays parcellation-agnostic
# (see `parcellations:` below), so schaefer1000 keeps working — it is what the
# smoke test still uses, since no timeseries dataset is anonymously readable
# and cneuromod2026 needs a real S3-credentialed fetch first.
parcellation: cneuromod2026

# Per-parcellation network partition. `network_order` is authoritative
# ordering for h5 storage; `labels_file` is written by `fetch-parcel-labels`
# (analysis/parcel_networks.py) — a parcel -> network lookup table that ships
# in neither *.timeseries repo, so it has to be built, not fetched verbatim.
parcellations:
  schaefer1000:
    labels_file: source_data/schaefer1000_networks.tsv
    network_order: [Vis, SomMot, DorsAttn, SalVentAttn, Limbic, Cont, Default]
  cneuromod2026:
    labels_file: source_data/cneuromod2026_networks.tsv
    network_order:
      [Vis, SomMot, DorsAttn, SalVentAttn, Limbic, Cont, Default,
       cerebellum, subcortex]

# TR is not recorded anywhere in the timeseries .h5 files (no HDF5 attributes
# at all), so it is config.
tr_seconds: 1.5

# The two connectome measures `run-connectomes` computes for every network,
# identically (CLAUDE.md, "Settled analysis decisions"). partial_ledoitwolf
# (nilearn's default-shrinkage partial correlation, an established regularized
# estimator) is the primary measure; pearson is the comparator.
connectome_measures: [pearson, partial_ledoitwolf]

# Canonical target for `invoke run-smoke` (overridable with --dataset/--subject).
# No timeseries dataset is anonymously readable yet (see source_data/CONTENT.md),
# so the target is not chosen for open access — it is chosen for size. movie10 is
# a small, long-standing dataset; the smoke test fetches one subject and fails
# only if the subdataset *tree* cannot be installed, which needs no credentials.
# sub-01's schaefer1000 content happens to be an unfetched/broken annex link on
# this machine while sub-02's is present, hence sub-02.
smoke_dataset: movie10
smoke_subject: "02"
# The smoke test pins schaefer1000 regardless of the `parcellation` above, so
# it keeps passing offline with data already on disk while cneuromod2026 is
# still being fetched (it needs S3 credentials this environment lacks).
smoke_parcellation: schaefer1000

# provenance records
#
# Written by `fetch` and `run` (see airoh.provenance). Both are git-tracked:
# they are small, and they are the only record of what produced a result when
# datalad is not in play. PROVENANCE.json is *expected* to change on every run
# — that churn is the record doing its job, not a bug to fix.
manifest_file: source_data/MANIFEST.json
provenance_file: output_data/PROVENANCE.json
# Files above this size record their metadata but no checksum, so one large
# asset cannot make every fetch crawl.
provenance_hash_max_bytes: 104857600

# `invoke verify` settings — all optional; delete this block to accept the
# defaults. See CLAUDE.md, "Verification".
verify:
  # Check names to skip entirely, e.g. [lint, tracked_size].
  skip_checks: []
  # Glob patterns exempt from the path and tracked-file checks.
  ignore_paths:
    # ruff.toml: CLAUDE.md mentions it conditionally (only non-uv projects
    # have it), which otherwise trips the doc_paths check in this uv project.
    - ruff.toml
    # The composed montage links panels that only exist after a full run.
    - output_data/figures/*
    # Not paths in this repo — prose the docs must be able to name:
    # the upstream GitHub repos, a git ref, and a file extension.
    - courtois-neuromod/*.timeseries
    - origin/main
    - .tsv
    # Per-environment cache of content this machine could not retrieve, written
    # by fetch-timeseries. Never committed (see source_data/.gitignore).
    - .fetch_failures.json
    # A path *inside* the cneuromod.all superdataset, deliberately NOT used by
    # this project (the parcellations ship inside the timeseries repos). The
    # docs name it to say so.
    - anat/atlases
    - atlases
    # Prose naming the cneuromod2026 parcellation and the upstream config file
    # that (misleadingly) points at anat/atlases for it — see CLAUDE.md, "Do
    # not point the pipeline at anat/atlases". Not paths in this repo.
    - cneuromod2026
    - schaefer1000Tian50Nette128.yaml
    # source_data/{parcellation}_networks.tsv, built by fetch-parcel-labels —
    # not present until that task has run.
    - cneuromod2026_networks.tsv
    # The timeseries repos' own documentation, cited by CLAUDE.md for the
    # atlas-entity naming drift. Lives upstream, not in this repo.
    - TIMESERIES.md
    # Output of the still-stubbed run-group-stats step: documented as
    # _(pending)_ in output_data/CONTENT.md, created once it is implemented.
    - output_data/group_stats
    - group_stats
    # A path *inside* the qa_figures checkout (source_data/cneuromod.all.qa_figures/
    # output_data/tables), only present after `invoke fetch-qa-figures`. Named in
    # prose relative to the checkout root, which the doc_paths check can't resolve.
    - output_data/tables
    # Prose from CONTENT.md describing qa_figures column/table naming, not paths.
    - fd_prop_gt02/gt05
    - friends.tsv
  # Largest file git may track before the check fails (default 10 MB).
  max_tracked_bytes: 10485760
