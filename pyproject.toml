[project]
name = "cneuromod-all-connectome-stats"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "airoh[datalad]>=0.5.0",
    "invoke",
    "requests",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "numpy>=1.24",
    "h5py>=3.8",
    "nilearn>=0.10",
    "scikit-learn>=1.3",
    "nibabel>=5.0",
    "ruff",
    "pytest",
]

[tool.pytest.ini_options]
# Confine collection to tests/. Without this, pytest follows the symlinked
# cneuromod.all superdataset under source_data/ and tries to collect the
# hundreds of test files that ship inside its subdatasets.
testpaths = ["tests"]
norecursedirs = ["source_data", "output_data", ".venv", ".git"]

[tool.ruff]
line-length = 100
# Same reason as pytest's testpaths: never lint the fetched source data.
extend-exclude = ["source_data", "output_data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
